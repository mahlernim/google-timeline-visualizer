name: Build privacy prototype

on:
  push:
    branches:
      - codex/privacy-location-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
      - name: Test, lint, and build prototype
        run: ./gradlew testPrototypeDebugUnitTest lintPrototypeDebug assemblePrototypeDebug --stacktrace
      - name: Verify prototype identity
        run: |
          apk_path="app/build/outputs/apk/prototype/debug/app-prototype-debug.apk"
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -f "$apk_path"
          "$build_tools_dir/apksigner" verify --verbose "$apk_path"
          package_line="$("$build_tools_dir/aapt" dump badging "$apk_path" | head -n 1)"
          grep -q "package: name='dev.mahlernim.timelinevisualizer.privacyprototype'" <<< "$package_line"
          grep -q "versionName='2.1.3-privacy-prototype.1'" <<< "$package_line"
          sha256sum "$apk_path" > "$apk_path.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: TimelineVisualizer-PrivacyPrototype-1
          path: |
            app/build/outputs/apk/prototype/debug/app-prototype-debug.apk
            app/build/outputs/apk/prototype/debug/app-prototype-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
