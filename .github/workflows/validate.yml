name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-vector-device-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore existing signing identity
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/vector-device-test.jks"
      - name: Build authenticated device test artifacts
        env:
          CARTO_ANDROID_BASEMAP_API_KEY: ${{ secrets.CARTO_ANDROID_BASEMAP_API_KEY }}
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/vector-device-test.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$CARTO_ANDROID_BASEMAP_API_KEY"
          ./gradlew -PsignedDeviceTests assembleGithubDebug assembleGithubDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: signed-vector-device-tests
          path: |
            app/build/outputs/apk/github/debug/*.apk
            app/build/outputs/apk/androidTest/github/debug/*.apk
          if-no-files-found: error
          retention-days: 1

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - name: Test, lint, and build
        run: |
          ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest lint assembleGithubDebug assemblePlayDebug assembleJournalLabDebug --stacktrace
          ./gradlew testJournalLabDebugUnitTest \
            --tests dev.mahlernim.timelinevisualizer.JournalLabUiTest \
            --tests dev.mahlernim.timelinevisualizer.JournalOnboardingUiTest \
            --tests dev.mahlernim.timelinevisualizer.journal.JournalOnboardingStoreTest \
            --tests dev.mahlernim.timelinevisualizer.journal.JournalSetupNavigationTest \
            --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: timeline-visualizer-debug
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  device-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 35, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run API ${{ matrix.api-level }} device smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedGithubDebugAndroidTest --stacktrace
