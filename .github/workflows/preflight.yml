name: Repository preflight

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks 8.30.1
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tool_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tool_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
      - name: Scan for secrets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # Full-history audits are explicitly requested through Run workflow.
            "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact=100 --no-banner
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            elif [[ "$EVENT_NAME" == "push" ]]; then
              # Do not silently fall back to a full-history scan without a baseline.
              if ! git cat-file -e "$BASE_SHA^{commit}"; then
                echo "::error::Push baseline unavailable. Run a manual full-history audit."
                exit 1
              fi
              base=$BASE_SHA
            else
              echo "::error::Unsupported scan event."
              exit 1
            fi
            "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact=100 --no-banner \
              --log-opts="$base..$HEAD_SHA"
          fi
